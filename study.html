<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Estudiando | Aprendeya</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-[#F7F5F2] min-h-screen p-6 md:p-12">

  <header class="max-w-4xl mx-auto flex items-center justify-between mb-10">
    <a href="index.html" class="text-sm font-medium hover:opacity-60">← Volver</a>
    <h1 class="text-lg font-bold">Tu kit de estudio</h1>
    <span id="contador" class="text-sm text-[#8A8580]"></span>
  </header>

  <div class="max-w-4xl mx-auto flex gap-2 mb-8">
    <button onclick="cambiarTab('flash')" id="tab-flash"
      class="px-5 py-2.5 rounded-full text-sm font-semibold bg-[#1A1A1A] text-white">Flashcards</button>
    <button onclick="cambiarTab('quiz')" id="tab-quiz"
      class="px-5 py-2.5 rounded-full text-sm font-semibold border border-[#D6D1CA]">Quiz</button>
  </div>

  <main class="max-w-4xl mx-auto">
    <div id="loading" class="text-center py-24">
      <div class="inline-block w-8 h-8 border-4 border-[#1A1A1A] border-t-transparent rounded-full animate-spin mb-4"></div>
      <p class="text-sm text-[#8A8580]">La IA está preparando tu material pedagógico...</p>
    </div>

    <div id="flashContainer" class="hidden">
      <div id="card" onclick="voltear()"
        class="bg-white rounded-3xl shadow-sm min-h-[280px] flex items-center justify-center text-center p-10 cursor-pointer hover:shadow-md transition select-none">
        <p id="cardText" class="text-xl md:text-2xl font-medium"></p>
      </div>
      <div class="flex justify-center gap-3 mt-6">
        <button onclick="anterior()" class="px-6 py-3 rounded-full border border-[#D6D1CA] text-sm font-semibold hover:bg-white">← Anterior</button>
        <button onclick="siguiente()" class="px-6 py-3 rounded-full bg-[#1A1A1A] text-white text-sm font-semibold hover:bg-opacity-80">Siguiente →</button>
      </div>
    </div>

    <div id="quizContainer" class="hidden"></div>
  </main>

  <script src="api.js"></script>
  <script src="study.js"></script>
</body>
</html>
