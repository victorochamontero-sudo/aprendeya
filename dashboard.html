<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mis Kits | AprendeYa</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-[#F7F5F2] dark:bg-[#121212] text-[#1A1A1A] dark:text-white min-h-screen flex transition-colors duration-300">

  <aside class="w-64 bg-white dark:bg-[#1E1E1E] border-r border-[#E5E1DA] dark:border-[#333] flex-col hidden md:flex min-h-screen fixed z-40">
    <div class="p-5 flex items-center border-b border-[#E5E1DA] dark:border-[#333]">
      <a href="index.html" class="flex items-center group">
        <div class="w-9 h-9 rounded-xl bg-[#1A1A1A] dark:bg-white flex items-center justify-center shadow-md z-10"><span class="text-white dark:text-black font-extrabold text-xl leading-none">A</span></div>
        <span class="font-extrabold text-xl tracking-tighter text-[#1A1A1A] dark:text-white ml-0.5 z-0 group-hover:text-blue-600 transition-colors">prendeYa</span>
      </a>
    </div>
    
    <div class="p-4 flex-1 overflow-y-auto space-y-1">
      <p class="text-xs font-bold text-[#8A8580] uppercase tracking-wider mb-3 mt-2 px-3">Menú</p>
      
      <div class="mb-4">
        <button id="btnSidebarUser" onclick="abrirModalLogin()" class="w-full bg-[#1A1A1A] dark:bg-white text-white dark:text-black text-sm font-semibold px-4 py-3 rounded-xl hover:bg-opacity-80 transition shadow-md flex items-center justify-center gap-2">
          <span class="text-lg">✨</span> Ingresar / Registrarse
        </button>
      </div>

      <a href="index.html" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl font-medium text-[#5A5550] dark:text-gray-300 hover:bg-[#F7F5F2] dark:hover:bg-[#2A2A2A] transition"><span class="text-lg">🏠</span> Inicio</a>
      <a href="dashboard.html" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl font-semibold bg-[#E8E6ED] dark:bg-[#2A2A2A] text-[#1A1A1A] dark:text-white transition"><span class="text-lg">📚</span> Mis Kits</a>
      <a href="perfil.html" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl font-medium text-[#5A5550] dark:text-gray-300 hover:bg-[#F7F5F2] dark:hover:bg-[#2A2A2A] transition"><span class="text-lg">🏆</span> Mi Perfil</a>
      
      <button onclick="toggleDarkMode()" id="btnDarkMode" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl font-medium text-[#5A5550] dark:text-gray-300 hover:bg-[#F7F5F2] dark:hover:bg-[#2A2A2A] transition">
        <span class="text-lg" id="iconoDark">🌙</span> <span id="textoDark">Modo Oscuro</span>
      </button>

      <!-- SELECTOR DE IDIOMA -->
      <div class="mt-6 border-t border-[#E5E1DA] dark:border-[#333] pt-4 pb-4">
        <p class="text-xs font-bold text-[#8A8580] uppercase tracking-wider mb-2 px-3">Idioma</p>
        <select onchange="cambiarIdiomaGlobal(this.value)" class="w-full bg-[#F7F5F2] dark:bg-[#2A2A2A] border border-[#E5E1DA] dark:border-[#444] text-[#1A1A1A] dark:text-white rounded-xl px-4 py-2 text-sm focus:outline-none">
          <option value="es">🇪🇸 Español</option>
          <option value="en">🇺🇸 English</option>
          <option value="pt">🇧🇷 Português</option>
          <option value="fr">🇫🇷 Français</option>
        </select>
      </div>
    </div>
  </aside>

  <main class="flex-1 md:ml-64 flex flex-col min-h-screen relative pb-20 md:pb-0 p-4 md:p-8">
    <header class="bg-white dark:bg-[#1E1E1E] border-b border-[#E5E1DA] dark:border-[#333] px-4 py-3 flex items-center justify-between md:hidden sticky top-0 z-40 -mx-4 -mt-4 mb-4">
      <a href="index.html" class="flex items-center"><div class="w-8 h-8 rounded-lg bg-[#1A1A1A] dark:bg-white flex items-center justify-center shadow-md z-10"><span class="text-white dark:text-black font-extrabold text-base leading-none">A</span></div><span class="font-extrabold text-lg tracking-tighter text-[#1A1A1A] dark:text-white ml-0.5 z-0">prendeYa</span></a>
      <a href="perfil.html" class="text-xl">🏆</a>
    </header>

    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8">
      <div><h1 class="text-3xl font-extrabold text-[#1A1A1A] dark:text-white">Mis Kits de Estudio</h1><p class="text-sm text-[#8A8580] dark:text-gray-400">Organiza y repasa todo tu material.</p></div>
      <a href="index.html" class="bg-[#1A1A1A] dark:bg-white text-white dark:text-black font-bold px-6 py-3 rounded-full hover:bg-opacity-80 transition shadow-md flex items-center gap-2"><span>+</span> Crear un Kit</a>
    </div>

    <div class="flex flex-col sm:flex-row gap-4 mb-8">
      <div class="relative flex-1">
        <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-[#8A8580]"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg></div>
        <input type="text" id="buscadorKits" onkeyup="filtrarKits()" placeholder="Buscar Kit..." class="w-full bg-white dark:bg-[#1E1E1E] border border-[#E5E1DA] dark:border-[#333] rounded-full py-3 pl-12 pr-4 text-sm focus:outline-none focus:border-[#1A1A1A] dark:focus:border-white transition shadow-sm dark:text-white">
      </div>
    </div>

    <div id="kitsVacios" class="text-center py-20 hidden bg-white dark:bg-[#1E1E1E] rounded-3xl border border-[#E5E1DA] dark:border-[#333]">
      <p class="text-5xl mb-4">📭</p><p class="text-lg font-semibold mb-2 dark:text-white">Aún no tienes kits guardados</p><p class="text-sm text-[#8A8580] mb-6">Ve a la página principal y genera tu primer kit de estudio.</p>
      <a href="index.html" class="bg-[#1A1A1A] dark:bg-white text-white dark:text-black px-6 py-3 rounded-full text-sm font-semibold hover:bg-opacity-80 transition">Crear mi primer Kit</a>
    </div>

    <div id="listaKits" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </main>

  <nav class="md:hidden fixed bottom-0 w-full bg-white dark:bg-[#1E1E1E] border-t border-[#E5E1DA] dark:border-[#333] flex justify-around py-2 z-50">
    <a href="index.html" class="flex flex-col items-center p-2 text-[#8A8580] dark:text-gray-400"><span class="text-xl mb-1">🏠</span><span class="text-[10px] font-medium">Inicio</span></a>
    <a href="dashboard.html" class="flex flex-col items-center p-2 text-[#1A1A1A] dark:text-white"><span class="text-xl mb-1">📚</span><span class="text-[10px] font-bold">Kits</span></a>
    <a href="perfil.html" class="flex flex-col items-center p-2 text-[#8A8580] dark:text-gray-400"><span class="text-xl mb-1">🏆</span><span class="text-[10px] font-medium">Perfil</span></a>
  </nav>

  <script src="app.js"></script>
  <script>
    const coloresKits = ['bg-purple-200 dark:bg-purple-900/50', 'bg-blue-200 dark:bg-blue-900/50', 'bg-green-200 dark:bg-green-900/50', 'bg-yellow-200 dark:bg-yellow-900/50', 'bg-red-200 dark:bg-red-900/50', 'bg-pink-200 dark:bg-pink-900/50', 'bg-indigo-200 dark:bg-indigo-900/50', 'bg-teal-200 dark:bg-teal-900/50'];

    function cargarKits() {
      const historial = JSON.parse(localStorage.getItem('historialKits') || '[]');
      const contenedor = document.getElementById('listaKits');
      const vacio = document.getElementById('kitsVacios');

      if (historial.length === 0) {
        vacio.classList.remove('hidden');
        contenedor.innerHTML = '';
        return;
      }

      vacio.classList.add('hidden');
      contenedor.innerHTML = historial.map(kit => {
        const colorIndex = Math.abs(kit.id) % coloresKits.length;
        const colorClase = coloresKits[colorIndex];
        
        return `
        <div class="kit-card ${colorClase} p-6 rounded-3xl shadow-sm hover:shadow-md transition relative group" data-nombre="${kit.nombre.toLowerCase()}">
          <div class="absolute top-4 right-4">
            <button onclick="toggleMenu(event, ${kit.id})" class="text-black/50 dark:text-white/50 hover:text-black dark:hover:text-white p-1 rounded-full hover:bg-white/30 dark:hover:bg-black/30 transition">
              <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path d="M10 6a2 2 0 110-4 2 2 0 010 4zM10 12a2 2 0 110-4 2 2 0 010 4zM10 18a2 2 0 110-4 2 2 0 010 4z" /></svg>
            </button>
            <div id="menu-${kit.id}" class="hidden absolute right-0 mt-2 w-48 bg-white dark:bg-[#1E1E1E] rounded-xl shadow-xl border border-[#E5E1DA] dark:border-[#333] py-2 z-20 text-sm">
              <button onclick="compartirKit('${kit.nombre}')" class="w-full text-left px-4 py-2 hover:bg-[#F7F5F2] dark:hover:bg-[#2A2A2A] flex items-center gap-2 text-[#1A1A1A] dark:text-white">👥 Compartir</button>
              <button onclick="renombrarKit(${kit.id})" class="w-full text-left px-4 py-2 hover:bg-[#F7F5F2] dark:hover:bg-[#2A2A2A] flex items-center gap-2 text-[#1A1A1A] dark:text-white">✏️ Renombrar</button>
              <button onclick="borrarKit(${kit.id})" class="w-full text-left px-4 py-2 hover:bg-[#F7F5F2] dark:hover:bg-[#2A2A2A] flex items-center gap-2 text-red-600 dark:text-red-400">🗑️ Eliminar</button>
            </div>
          </div>

          <div class="cursor-pointer" onclick="abrirKit(${kit.id})">
            <h3 class="font-bold text-xl text-[#1A1A1A] dark:text-white pr-8 mb-2">${kit.nombre}</h3>
            <p class="text-sm text-black/60 dark:text-white/60 mb-6">${kit.material.flashcards.length} Tarjetas</p>
            <div class="w-full bg-white/50 dark:bg-black/20 rounded-full h-2 mb-4"><div class="bg-white dark:bg-white/50 h-2 rounded-full" style="width: 100%"></div></div>
            <p class="text-xs text-black/50 dark:text-white/50 font-medium">Listo para estudiar</p>
          </div>
        </div>
      `}).join('');
    }

    function toggleMenu(event, id) {
      event.stopPropagation();
      document.querySelectorAll('[id^="menu-"]').forEach(m => m.classList.add('hidden'));
      document.getElementById(`menu-${id}`).classList.toggle('hidden');
    }

    document.addEventListener('click', () => {
      document.querySelectorAll('[id^="menu-"]').forEach(m => m.classList.add('hidden'));
    });

    function filtrarKits() {
      const texto = document.getElementById('buscadorKits').value.toLowerCase();
      document.querySelectorAll('.kit-card').forEach(tarjeta => {
        const nombre = tarjeta.getAttribute('data-nombre');
        tarjeta.style.display = nombre.includes(texto) ? 'block' : 'none';
      });
    }

    function abrirKit(id) {
      const historial = JSON.parse(localStorage.getItem('historialKits') || '[]');
      const kit = historial.find(k => k.id === id);
      if (kit) {
        localStorage.setItem('materialGenerado', JSON.stringify(kit.material));
        localStorage.setItem('nombreMaterial', kit.nombre);
        localStorage.setItem('material', 'cargado desde historial'); 
        window.location.href = 'study.html';
      }
    }

    function renombrarKit(id) {
      const historial = JSON.parse(localStorage.getItem('historialKits') || '[]');
      const kit = historial.find(k => k.id === id);
      if (!kit) return;
      const nuevoNombre = prompt("Cambia el nombre del Kit:", kit.nombre);
      if (nuevoNombre && nuevoNombre.trim() !== '') {
        kit.nombre = nuevoNombre.trim();
        localStorage.setItem('historialKits', JSON.stringify(historial));
        cargarKits();
      }
    }

    function borrarKit(id) {
      if (!confirm('¿Estás seguro de que quieres borrar este kit de estudio?')) return;
      let historial = JSON.parse(localStorage.getItem('historialKits') || '[]');
      historial = historial.filter(k => k.id !== id);
      localStorage.setItem('historialKits', JSON.stringify(historial));
      cargarKits();
    }

    function compartirKit(nombre) {
      const texto = `¡Estoy estudiando con AprendeYa! Te comparto mi Kit de "${nombre}". Ingresa aquí:`;
      const url = "https://victorochamontero-sudo.github.io/aprendeya/";
      if (navigator.share) {
        navigator.share({ title: 'AprendeYa - Mi Kit', text: texto, url: url }).catch(console.error);
      } else {
        navigator.clipboard.writeText(`${texto} ${url}`);
        alert('¡Enlace copiado al portapapeles!');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      cargarKits();
    });
  </script>
</body>
</html>
