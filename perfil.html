<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Perfil | AprendeYa</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-[#F7F5F2] min-h-screen p-6 md:p-12">

  <header class="max-w-4xl mx-auto flex items-center justify-between mb-8">
    <a href="index.html" class="text-sm font-medium hover:opacity-60 flex items-center gap-2">← Volver al inicio</a>
    <h1 class="text-2xl font-extrabold">Mi Perfil y Logros</h1>
    <button onclick="compartirProgreso()" class="bg-[#1A1A1A] text-white text-sm font-semibold px-4 py-2 rounded-full hover:bg-opacity-80 transition flex items-center gap-2">
      Compartir
    </button>
  </header>

  <main class="max-w-4xl mx-auto space-y-6">
    <div class="bg-gradient-to-r from-blue-600 to-purple-600 rounded-3xl p-8 text-white shadow-lg flex items-center gap-6">
      <div class="w-20 h-20 bg-white/20 rounded-full flex items-center justify-center text-4xl">🧑‍🎓</div>
      <div>
        <h2 class="text-2xl font-bold">¡Hola, Estudiante!</h2>
        <p class="text-white/80 text-sm">Sigue así, cada día estás más cerca de dominar tus materias.</p>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-white p-6 rounded-3xl shadow-sm border border-[#E5E1DA] text-center">
        <p class="text-4xl mb-2">📚</p>
        <p id="statKits" class="text-3xl font-extrabold text-[#1A1A1A]">0</p>
        <p class="text-sm text-[#8A8580] font-medium">Kits de Estudio</p>
      </div>
      <div class="bg-white p-6 rounded-3xl shadow-sm border border-[#E5E1DA] text-center">
        <p class="text-4xl mb-2">🎯</p>
        <p id="statTarjetas" class="text-3xl font-extrabold text-[#1A1A1A]">0</p>
        <p class="text-sm text-[#8A8580] font-medium">Tarjetas Creadas</p>
      </div>
      <div class="bg-white p-6 rounded-3xl shadow-sm border border-[#E5E1DA] text-center">
        <p class="text-4xl mb-2">🔥</p>
        <p class="text-3xl font-extrabold text-[#1A1A1A]">1</p>
        <p class="text-sm text-[#8A8580] font-medium">Días de racha</p>
      </div>
    </div>
  </main>

  <script>
    const historial = JSON.parse(localStorage.getItem('historialKits') || '[]');
    let totalTarjetas = 0;
    historial.forEach(kit => {
      if (kit.material && kit.material.flashcards) totalTarjetas += kit.material.flashcards.length;
    });
    document.getElementById('statKits').textContent = historial.length;
    document.getElementById('statTarjetas').textContent = totalTarjetas;

    function compartirProgreso() {
      const texto = `¡Estoy estudiando con AprendeYa! 🚀 Ya he creado ${historial.length} kits y repasado ${totalTarjetas} tarjetas.`;
      if (navigator.share) {
        navigator.share({ title: 'Mi progreso', text: texto, url: window.location.href }).catch(console.error);
      } else {
        navigator.clipboard.writeText(texto);
        alert('¡Texto copiado al portapapeles!');
      }
    }
  </script>
</body>
</html>
