<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Perfil | AprendeYa</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-[#F7F5F2] min-h-screen p-6 md:p-12">

  <header class="max-w-4xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4 mb-8">
    <a href="index.html" class="flex items-center group">
      <div class="w-8 h-8 rounded-lg bg-[#1A1A1A] flex items-center justify-center shadow-md z-10">
        <span class="text-white font-extrabold text-base leading-none">A</span>
      </div>
      <span class="font-extrabold text-lg tracking-tighter text-[#1A1A1A] ml-0.5 z-0 group-hover:text-blue-600 transition-colors">
        prendeYa
      </span>
    </a>
    
    <h1 class="text-2xl font-extrabold order-first md:order-none">Mi Perfil y Logros</h1>
    
    <div class="flex gap-2 w-full md:w-auto justify-center">
      <button onclick="compartirProgreso()" class="bg-blue-600 text-white text-sm font-semibold px-4 py-2 rounded-full hover:bg-blue-700 transition flex items-center gap-2">
        Compartir Progreso
      </button>
      <button onclick="cerrarSesion()" class="text-sm font-semibold text-red-500 hover:text-red-700 bg-red-50 px-4 py-2 rounded-full transition">
        Cerrar Sesión
      </button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto space-y-6">
    
    <div class="bg-gradient-to-r from-blue-600 to-purple-600 rounded-3xl p-8 text-white shadow-lg flex flex-col md:flex-row items-center gap-6">
      <div class="relative group cursor-pointer" onclick="document.getElementById('fotoInput').click()">
        <div id="fotoPerfil" class="w-24 h-24 bg-white/20 rounded-full flex items-center justify-center text-4xl overflow-hidden border-4 border-white shadow-inner">🧑‍🎓</div>
        <div class="absolute inset-0 bg-black/40 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition"><span class="text-2xl">📷</span></div>
      </div>
      <input type="file" id="fotoInput" class="hidden" accept="image/*" onchange="cambiarFoto(event)" />

      <div class="text-center md:text-left">
        <h2 id="nombreUsuario" class="text-2xl font-bold">¡Hola, Estudiante!</h2>
        <p class="text-white/80 text-sm">Sigue así, cada día estás más cerca de dominar tus materias.</p>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <a href="dashboard.html" class="bg-white p-6 rounded-3xl shadow-sm border border-[#E5E1DA] text-center hover:shadow-md hover:border-blue-400 transition transform hover:-translate-y-1 cursor-pointer">
        <p class="text-4xl mb-2">📚</p>
        <p id="statKits" class="text-3xl font-extrabold text-[#1A1A1A]">0</p>
        <p class="text-sm text-[#8A8580] font-medium">Kits de Estudio</p>
      </a>
      <a href="dashboard.html" class="bg-white p-6 rounded-3xl shadow-sm border border-[#E5E1DA] text-center hover:shadow-md hover:border-blue-400 transition transform hover:-translate-y-1 cursor-pointer">
        <p class="text-4xl mb-2">🎯</p>
        <p id="statTarjetas" class="text-3xl font-extrabold text-[#1A1A1A]">0</p>
        <p class="text-sm text-[#8A8580] font-medium">Tarjetas Creadas</p>
      </a>
      <div class="bg-white p-6 rounded-3xl shadow-sm border border-[#E5E1DA] text-center">
        <p class="text-4xl mb-2">🔥</p>
        <p class="text-3xl font-extrabold text-[#1A1A1A]">1</p>
        <p class="text-sm text-[#8A8580] font-medium">Días de racha</p>
      </div>
    </div>
  </main>

  <script>
    const usuario = JSON.parse(localStorage.getItem('usuarioAprendeYa') || 'null');
    if (usuario) {
      document.getElementById('nombreUsuario').textContent = `¡Hola, ${usuario.nombre}!`;
    }

    const historial = JSON.parse(localStorage.getItem('historialKits') || '[]');
    let totalTarjetas = 0;
    historial.forEach(kit => {
      if (kit.material && kit.material.flashcards) totalTarjetas += kit.material.flashcards.length;
    });
    document.getElementById('statKits').textContent = historial.length;
    document.getElementById('statTarjetas').textContent = totalTarjetas;

    const fotoGuardada = localStorage.getItem('fotoPerfil');
    if (fotoGuardada) {
      document.getElementById('fotoPerfil').innerHTML = `<img src="${fotoGuardada}" class="w-full h-full object-cover">`;
    }
    function cambiarFoto(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        const base64 = event.target.result;
        localStorage.setItem('fotoPerfil', base64);
        document.getElementById('fotoPerfil').innerHTML = `<img src="${base64}" class="w-full h-full object-cover">`;
      };
      reader.readAsDataURL(file);
    }

    function compartirProgreso() {
      const texto = `¡Estoy estudiando con AprendeYa! 🚀 Ya he creado ${historial.length} kits y repasado ${totalTarjetas} tarjetas. ¡Únete!`;
      const url = "https://victorochamontero-sudo.github.io/aprendeya/";
      
      if (navigator.share) {
        navigator.share({ title: 'Mi progreso en AprendeYa', text: texto, url: url }).catch(console.error);
      } else {
        navigator.clipboard.writeText(`${texto} ${url}`);
        alert('¡Texto copiado al portapapeles! Pégalo en tus redes sociales.');
      }
    }

    function cerrarSesion() {
      localStorage.removeItem('usuarioAprendeYa');
      alert('Sesión cerrada. Vuelves a ser un usuario invitado.');
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
